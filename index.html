<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaan အတွက် နေ့စဉ် Routine & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBK8iVjKRXSx0O_Bb9SLOZSQ1gV5RRgyI",
            authDomain: "jaan-fc3ac.firebaseapp.com",
            databaseURL: "https://jaan-fc3ac-default-rtdb.firebaseio.com",
            projectId: "jaan-fc3ac",
            storageBucket: "jaan-fc3ac.firebasestorage.app",
            messagingSenderId: "470741444009",
            appId: "1:470741444009:web:cebe1fd6ac721fbedb50b8",
            measurementId: "G-L2VH1V3MFM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const fieldIds = [
            'fajr', 'dhuhr', 'asr', 'maghrib', 'isha',
            'fajrQuran', 'wentToSchool', 'studyHome', 'drankJuice',
            'parahRead', 'revisionRead'
        ];

        const taskLabels = {
            'fajr': 'ဖဂျရ် (Fajr) နမားဇ်',
            'dhuhr': 'ဇဟိုရ် (Dhuhr) နမားဇ်',
            'asr': 'အဆွရ် (Asr) နမားဇ်',
            'maghrib': 'မဂ်ရိဘ် (Maghrib) နမားဇ်',
            'isha': 'အစ်ရှာ (Isha) နမားဇ်',
            'fajrQuran': 'ဖဂျရ်ပြီး ကုရ်အာန် ကျက်ခြင်း',
            'wentToSchool': 'ကျောင်းသွားခြင်း',
            'studyHome': 'အိမ်မှာ စာကျက်ခြင်း',
            'drankJuice': 'အိမ်ပြန်လာလျှင် ဖျော်ရည်သောက်ခြင်း'
        };

        let isLocalChange = false;

        window.saveData = function() {
            const daySelect = document.getElementById('daySelect');
            if (!daySelect) return;
            const selectedDay = daySelect.value;
            const dayData = {};

            fieldIds.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    dayData[id] = (element.type === 'checkbox') ? element.checked : element.value;
                }
            });

            isLocalChange = true;
            set(ref(db, 'jaan_tracker/' + selectedDay), dayData)
                .then(() => {
                    document.getElementById('statusMsg').textContent = "သိမ်းဆည်းပြီးပါပြီ ✨";
                    setTimeout(() => { isLocalChange = false; }, 500);
                })
                .catch(() => { isLocalChange = false; });
        }

        window.loadDayData = function() {
            const daySelect = document.getElementById('daySelect');
            if (!daySelect) return;
            const selectedDay = daySelect.value;
            const dayRef = ref(db, 'jaan_tracker/' + selectedDay);

            onValue(dayRef, (snapshot) => {
                if (isLocalChange) return;
                const data = snapshot.val() || {};
                
                fieldIds.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        if (element.type === 'checkbox') {
                            element.checked = data[id] || false;
                        } else {
                            if (document.activeElement !== element) {
                                element.value = data[id] || '';
                            }
                        }
                    }
                });

                updateSummaryView(data, selectedDay);
                document.getElementById('statusMsg').textContent = "Live Sync ချိတ်ဆက်ထားပါသည် 🟢";
            });
        }

        function updateSummaryView(data, dayKey) {
            const dayNum = dayKey.replace('day_', '');
            document.getElementById('summaryTitle').textContent = `📊 Day ${dayNum} ၏ ပြီးစီးမှု အခြေအနေ`;

            const checkboxes = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha', 'fajrQuran', 'wentToSchool', 'studyHome', 'drankJuice'];
            let completedCount = 0;
            const completedList = document.getElementById('completedList');
            completedList.innerHTML = '';

            checkboxes.forEach(id => {
                if (data[id]) {
                    completedCount++;
                    const item = document.createElement('div');
                    item.className = 'completed-badge';
                    item.innerHTML = `<span>✓</span> ${taskLabels[id]}`;
                    completedList.appendChild(item);
                }
            });

            document.getElementById('summaryParah').textContent = data['parahRead'] || 'မှတ်တမ်းမရှိပါ';
            document.getElementById('summaryRevision').textContent = data['revisionRead'] || 'မှတ်တမ်းမရှိပါ';

            const percent = Math.round((completedCount / checkboxes.length) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressPercent').textContent = `${percent}% ပြီးစီးပါပြီ (${completedCount}/${checkboxes.length})`;

            if (completedCount === 0) {
                completedList.innerHTML = '<p class="empty-msg">လုပ်ဆောင်ထားသည့် Task များ မရှိသေးပါ</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const daySelect = document.getElementById('daySelect');
            for (let i = 1; i <= 60; i++) {
                const option = document.createElement('option');
                option.value = `day_${i}`;
                option.textContent = `Day ${i}`;
                daySelect.appendChild(option);
            }
            daySelect.addEventListener('change', window.loadDayData);
            window.loadDayData();
        });
    </script>

    <style>
        :root { --primary: #064e3b; --light: #10b981; --gold: #d97706; --bg: #f0fdf4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Padauk', sans-serif; }
        body { background-color: var(--bg); color: #1f2937; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 20px; border: 1px solid #d1fae5; }
        header { text-align: center; border-bottom: 2px solid #ecfdf5; padding-bottom: 12px; margin-bottom: 16px; }
        header h1 { color: var(--primary); font-size: 22px; }
        header p { color: var(--gold); font-weight: bold; font-size: 14px; }

        .day-selector-container { margin-bottom: 16px; }
        .day-selector-container label { font-weight: bold; color: var(--primary); display: block; margin-bottom: 6px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--light); font-size: 16px; background-color: #f7fee7; color: var(--primary); font-weight: bold; outline: none; }

        .summary-card { background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%); border: 2px solid #a7f3d0; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .summary-card h2 { color: var(--primary); font-size: 16px; margin-bottom: 10px; }
        .progress-bar-bg { background-color: #e5e7eb; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
        .progress-bar-fill { background-color: var(--light); height: 100%; width: 0%; transition: width 0.4s; }
        .progress-text { font-size: 12px; font-weight: bold; color: var(--primary); text-align: right; }
        .completed-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .completed-badge { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; border-radius: 15px; padding: 4px 10px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .empty-msg { font-size: 12px; color: #9ca3af; font-style: italic; }
        .summary-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; border-top: 1px dashed #a7f3d0; padding-top: 10px; font-size: 12px; }
        .note-box { background: white; padding: 8px 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
        .note-box strong { color: var(--primary); display: block; }

        .section-title { background-color: var(--primary); color: white; padding: 8px 12px; border-radius: 8px; font-size: 15px; margin: 16px 0 10px 0; font-weight: bold; }
        .task-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .task-card { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
        .task-card label { font-size: 14px; cursor: pointer; flex-grow: 1; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--light); cursor: pointer; }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .input-card { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
        .input-card label { font-weight: bold; color: var(--primary); font-size: 13px; }
        input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 14px; outline: none; }
        
        .status-msg { text-align: center; margin-top: 16px; font-size: 13px; color: var(--light); font-weight: bold; min-height: 18px; }
        footer { text-align: center; margin-top: 20px; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💖 Jaan အတွက် နေ့စဉ် Routine Tracker</h1>
        <p>Live Sync & Summary Dashboard</p>
    </header>

    <div class="day-selector-container">
        <label for="daySelect">📅 ရက်ရွေးချယ်ရန်:</label>
        <select id="daySelect"></select>
    </div>

    <!-- 📊 Dashboard Summary (ကိုယ့်ဘက်ကနေ လှမ်းကြည့်ရမည့်နေရာ) -->
    <div class="summary-card">
        <h2 id="summaryTitle">📊 Day 1 ၏ ပြီးစီးမှု အခြေအနေ</h2>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressPercent">0% ပြီးစီးပါပြီ</div>
        <div class="completed-list" id="completedList"></div>
        <div class="summary-notes">
            <div class="note-box"><strong>📖 ပါရဟ်</strong><span id="summaryParah">မှတ်တမ်းမရှိပါ</span></div>
            <div class="note-box"><strong>📚 ရှေ့စာ</strong><span id="summaryRevision">မှတ်တမ်းမရှိပါ</span></div>
        </div>
    </div>

    <!-- 1. နမားဇ် ၅ ကြိမ် -->
    <div class="section-title">🕌 နမားဇ် ၅ ကြိမ်</div>
    <div class="task-group">
        <div class="task-card"><label for="fajr">၁။ ဖဂျရ် (Fajr)</label><input type="checkbox" id="fajr" onchange="saveData()"></div>
        <div class="task-card"><label for="dhuhr">၂။ ဇဟိုရ် (Dhuhr)</label><input type="checkbox" id="dhuhr" onchange="saveData()"></div>
        <div class="task-card"><label for="asr">၃။ အဆွရ် (Asr)</label><input type="checkbox" id="asr" onchange="saveData()"></div>
        <div class="task-card"><label for="maghrib">၄။ မဂ်ရိဘ် (Maghrib)</label><input type="checkbox" id="maghrib" onchange="saveData()"></div>
        <div class="task-card"><label for="isha">၅။ အစ်ရှာ (Isha)</label><input type="checkbox" id="isha" onchange="saveData()"></div>
    </div>

    <!-- 2. ကုရ်အာန် နှင့် ကျောင်း -->
    <div class="section-title">📖 ကုရ်အာန် နှင့် ကျောင်းစာ</div>
    <div class="task-group">
        <div class="task-card"><label for="fajrQuran">ဖဂျရ်ပြီး ကုရ်အာန် ကျက်ခြင်း</label><input type="checkbox" id="fajrQuran" onchange="saveData()"></div>
        <div class="task-card"><label for="wentToSchool">ကျောင်းသွားခြင်း</label><input type="checkbox" id="wentToSchool" onchange="saveData()"></div>
        <div class="task-card"><label for="studyHome">အိမ်မှာ စာကျက်ခြင်း</label><input type="checkbox" id="studyHome" onchange="saveData()"></div>
    </div>

    <div class="input-group">
        <div class="input-card">
            <label for="parahRead">ကျောင်းမှာ ဖတ်ခဲ့သည့် ပါရဟ် (Parah)</label>
            <input type="text" id="parahRead" placeholder="ဥပမာ - ၁ ပါရဟ်" onchange="saveData()">
        </div>
        <div class="input-card">
            <label for="revisionRead">ဖတ်ခဲ့သည့် ရှေ့စာ (Revision)</label>
            <input type="text" id="revisionRead" placeholder="ဥပမာ - စူရာဟ် ယာစီးန်" onchange="saveData()">
        </div>
    </div>

    <!-- 3. ကျန်းမာရေး -->
    <div class="section-title">🥤 ကျန်းမာရေး</div>
    <div class="task-group">
        <div class="task-card"><label for="drankJuice">ဖျော်ရည် သောက်ဖြစ်ခြင်း</label><input type="checkbox" id="drankJuice" onchange="saveData()"></div>
    </div>

    <div class="status-msg" id="statusMsg">ချိတ်ဆက်နေပါသည်...</div>
    <footer><p>Jaan အတွက် အချစ်များစွာဖြင့် ❤️</p></footer>
</div>

</body>
</html>
